<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matan Malka - Resume</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #1c1c1e;
    --muted: #6b7280;
    --accent: #3f41c3;
    --rule: #e5e0d8;
    --bg: #ffffff;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', Arial, sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 10.3pt;
    line-height: 1.35;
    width: 210mm;
    margin: 0 auto;
  }

  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 13mm 16mm 13mm;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding-bottom: 7px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 9px;
  }

  .name {
    font-family: var(--serif);
    font-size: 27pt;
    line-height: 1;
    letter-spacing: -0.5px;
    color: var(--ink);
  }

  .tagline {
    font-size: 9pt;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.3px;
  }

  .contacts {
    text-align: right;
    font-size: 8.7pt;
    color: var(--muted);
    line-height: 1.4;
  }

  .contacts a { color: var(--muted); text-decoration: none; }
  .contacts a:hover { color: var(--accent); }

  .body { display: block; }

  .section { margin-bottom: 8px; }

  .section-label {
    font-size: 7pt;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--rule);
  }

  .about p {
    font-size: 10pt;
    color: #3a3a3c;
    line-height: 1.4;
  }

  .job { margin-bottom: 7px; }
  .job:last-child { margin-bottom: 0; }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .job-title {
    font-size: 10pt;
    font-weight: 600;
    color: var(--ink);
  }

  .job-date {
    font-size: 8.3pt;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .job-company {
    font-size: 8.7pt;
    color: var(--accent);
    margin-bottom: 2px;
  }

  ul { padding-left: 15px; }

  ul li {
    font-size: 10pt;
    color: #3a3a3c;
    margin-bottom: 1.5px;
    line-height: 1.35;
  }

  .edu { margin-bottom: 7px; }
  .edu:last-child { margin-bottom: 0; }

  .edu-title {
    font-size: 10pt;
    font-weight: 600;
  }

  .edu-sub {
    font-size: 8.7pt;
    color: var(--accent);
    margin-bottom: 2px;
  }

  .skills-list { list-style: none; padding: 0; }

  .skills-list li {
    display: flex;
    gap: 0;
    font-size: 10pt;
    margin-bottom: 2px;
    line-height: 1.35;
    color: #3a3a3c;
  }

  .skill-cat {
    font-weight: 600;
    white-space: nowrap;
    width: 160px;
    flex-shrink: 0;
    color: var(--ink);
  }

  .languages-row {
    display: flex;
    gap: 40px;
  }

  .lang-item {
    font-size: 9pt;
    color: var(--ink);
  }

  .lang-level {
    color: var(--muted);
    font-size: 8.7pt;
  }

  @media print {
    @page {
      size: A4;
      margin: 0;
    }

    html, body {
      width: 210mm;
      height: 297mm;
      margin: 0;
      background: #fff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      padding: 8mm 13mm 6mm;
      min-height: unset;
      height: 297mm;
      overflow: hidden;
      page-break-after: avoid;
      break-after: avoid;
    }

    * {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    a { color: inherit !important; text-decoration: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <div class="name">{{NAME}}</div>
      <div class="tagline">{{TAGLINE}}</div>
    </div>
    <div class="contacts">
{{CONTACTS}}
    </div>
  </header>

  <div class="body">
    <div class="main">

      <div class="section about">
        <div class="section-label">Profile</div>
        <p>{{PROFILE}}</p>
      </div>

      <div class="section">
        <div class="section-label">Work Experience</div>
{{WORK}}
      </div>

      <div class="section">
        <div class="section-label">Education</div>
{{EDUCATION}}
      </div>

      <div class="section">
        <div class="section-label">Skills</div>
        <ul class="skills-list">
{{SKILLS}}
        </ul>
      </div>

      <div class="section">
        <div class="section-label">Languages</div>
        <div class="languages-row">
{{LANGUAGES}}
        </div>
      </div>

    </div>
  </div>

</div>
</body>
</html>
