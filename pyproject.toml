[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-track-cv"
version = "1.0.0"
description = "Fact-safe multi-track CV engine"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "playwright>=1.48,<2",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
cv = "cv_engine.cli:main"

[tool.setuptools.packages.find]
include = ["cv_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra --strict-markers -m "not browser"'
markers = [
  "browser: needs a real headless Chromium/Chrome process (blocked by OS sandboxes)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
