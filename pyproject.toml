[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-track-cv"
version = "1.0.0"
description = "Fact-safe multi-track CV engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "Jinja2>=3.1,<4",
  "playwright>=1.48,<2",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = [
  # Starlette's TestClient is the only reason an HTTP client is here at all; no
  # ASGI server ships in M3, since `uvicorn` and `cv web` are M6 scope.
  #
  # `httpx2`, not `httpx`: starlette 1.6 imports `httpx2 as httpx` in its test
  # client and falls back to `httpx` with a DeprecationWarning. The warning is
  # accurate rather than noise - it names the supported client for the starlette
  # version fastapi pins - so the dependency moves instead of the warning being
  # filtered.
  "httpx2>=2.12,<3",
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
cv = "cv_engine.cli:main"

[tool.setuptools.packages.find]
include = ["cv_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra --strict-markers -m "not browser"'
markers = [
  "browser: needs a real headless Chromium/Chrome process (blocked by OS sandboxes)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E501 stays out: `ruff format` already enforces line-length 100 on everything it can
# split. What is left is unsplittable string literals (97 of them canonical fact text),
# and rewrapping those is churn on the most sensitive file in the repo.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Fixtures requested for their side effect, and pytest hook signatures, look unused
# to ARG but are load-bearing.
"tests/*" = ["ARG001", "ARG002"]

[tool.pyright]
# The ports are Protocols, so they are only a boundary if something checks them
# structurally. `basic` is what proves an adapter still satisfies the port it is
# wired to and that a service touches nothing outside its declared port; it found
# `Repository` no longer satisfying `ApplicationRepository`. `strict` is not
# adopted: its 200+ findings are unannotated locals, not contract drift.
include = ["cv_engine"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
